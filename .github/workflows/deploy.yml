name: Django CI/CD Pipeline

# This triggers the action whenever you push to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  # JOB 1: Linting and Testing (Required by Rubric)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # Stops the build if there are syntax errors
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Run tests with pytest
      run: |
        pytest

  # JOB 2: Deployment (Only runs if Job 1 passes)
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Deploy and Restart Server on DigitalOcean
      uses: appleboy/ssh-action@master
      with:
        host: 167.71.178.212
        username: root
        key: ${{ secrets.SSH_KEY }}
        script: |
          # 1. Navigate to the project folder
          cd /opt/Room_booking_serve
          
          # 2. Force the server to exactly match GitHub (downloads the database!)
          git fetch --all
          git reset --hard origin/main
          
          # 3. Activate environment and install any new packages
          source venv/bin/activate
          pip install -r requirements.txt
          
          # 4. Kill the old server and start the new one in the background
          pkill -f runserver || true
          nohup python manage.py runserver 0.0.0.0:8000 > server.log 2>&1 &
