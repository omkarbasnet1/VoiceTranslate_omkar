# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
        
    # steps added
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg portaudio19-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=Room_booking_serve/
        # stop the build if code is bad
        flake8 . --count --max-complexity=10 --max-line-length=127 --statistics --exclude=Room_booking_serve/
    # steps add
    - name: Create .env file
      env:
        SERVER_URL: ${{ secrets.SERVER_URL }}
        USER_EMAIL: ${{ secrets.USER_EMAIL }}
        USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      run: |
        echo "SERVER_URL=$SERVER_URL" >> .env
        echo "USER_EMAIL=$USER_EMAIL" >> .env
        echo "USER_PASSWORD=$USER_PASSWORD" >> .env
    - name: Test with pytest
      run: |
        pytest
  # NEW DEPLOYMENT JOB ADDED BELOW
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan ${{ secrets.DEPLOY_SERVER }} >> ~/.ssh/known_hosts

      - name: Deploy to droplet
        run: |
          ssh -i ~/.ssh/id_rsa deploy@${{ secrets.DEPLOY_SERVER }} "
            cd ~/Room_booking_serve &&
            git pull origin main &&
            source venv/bin/activate &&
            pip install -r requirements.txt &&
            pkill -f main.py || true &&
            nohup python3 main.py </dev/null > server.log 2>&1 &
            "
         
          
